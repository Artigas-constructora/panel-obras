<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Panel gerencial · Constructora Artigas</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(120deg,#1E2733 0%,#2B3542 55%,#3A1D1A 100%);color:#1E2733}
.c{background:#fff;border-radius:18px;padding:30px 28px;width:min(380px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.k{font-size:11px;letter-spacing:.14em;color:#C0392B;font-weight:800;text-transform:uppercase}h1{font-size:22px;margin:6px 0 4px}p{font-size:13px;color:#5B6675;margin:0 0 18px}
input[type=password]{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid #D5DBE2;border-radius:10px;outline:none}input[type=password]:focus{border-color:#C0392B}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:#5B6675;margin:12px 0 16px}button{width:100%;font-size:15px;font-weight:700;color:#fff;background:#C0392B;border:0;border-radius:999px;padding:12px;cursor:pointer}
#e{color:#C0392B;font-size:13px;min-height:18px;margin-top:10px;text-align:center}.f{margin-top:18px;font-size:11px;color:#8C97A4;text-align:center}</style></head>
<body><form class="c" id="f" autocomplete="off"><div class="k">Panel gerencial · uso interno</div><h1>Obras Constructora Artigas</h1>
<p>El acceso con contraseña se está configurando. Vuelve a intentarlo más tarde.</p><div id="e"></div><div class="f">Constructora Artigas · Autor: Joel Matus</div></form>
<script>const D={};
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(bits){const k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct)));document.open();document.write(t);document.close();}
async function derivar(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},b,256);}
if(D.ct){(async()=>{try{const g=localStorage.getItem('gerArt_'+D.salt);if(g)await abrir(u(g));}catch(e){try{localStorage.removeItem('gerArt_'+D.salt)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Verificando…';
 try{const bits=await derivar(document.getElementById('pw').value);
  if(document.getElementById('rec').checked){try{localStorage.setItem('gerArt_'+D.salt,btoa(String.fromCharCode(...new Uint8Array(bits))))}catch(_){}}
  await abrir(bits);}catch(x){e.textContent='Contraseña incorrecta';}});}
</script></body></html>
