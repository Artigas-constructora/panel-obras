const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(bits){const k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct)));
 const go=()=>{document.open();document.write(t);document.close();};
 if(document.readyState==='complete')setTimeout(go,0);else addEventListener('load',()=>setTimeout(go,0),{once:true});}
async function derivar(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},b,256);}
if(D.ct){(async()=>{try{const g=localStorage.getItem('gerArt_'+D.salt);if(g)await abrir(u(g));}catch(e){try{localStorage.removeItem('gerArt_'+D.salt)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Verificando…';
 try{const bits=await derivar(document.getElementById('pw').value);
  if(document.getElementById('rec').checked){try{localStorage.setItem('gerArt_'+D.salt,btoa(String.fromCharCode(...new Uint8Array(bits))))}catch(_){}}
  await abrir(bits);}catch(x){e.textContent='Contraseña incorrecta';}});}
</script></body></html>
