const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(bits){const k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct)));document.open();document.write(t);document.close();}
async function derivar(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
