async function abrir(bits){const k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct)));
 const go=()=>{document.open();document.write(t);document.close();};
 if(document.readyState==='complete')setTimeout(go,0);else addEventListener('load',()=>setTimeout(go,0),{once:true});}
async function derivar(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.salt),iterations:D.it,hash:'SHA-256'},b,256);}
